<!DOCTYPE html>
<html class="pos-bottom-left">
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #hover-pad {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: transparent;
      display: none;
    }
    #hover-pad.active {
      display: block;
    }
    .np {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: stretch;
      gap: 16px;
      min-width: 520px;
      max-width: min(74vw, 820px);
      padding: 14px 18px 14px 14px;
      border-radius: 18px;
      color: #f6f7fb;
      background: rgba(8, 8, 12, 0.58);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 22px 60px rgba(0,0,0,0.55);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease, transform 0.55s ease, top 0.25s ease, right 0.25s ease, bottom 0.25s ease, left 0.25s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }
    .np::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 4;
      box-sizing: border-box;
      opacity: 0;
      box-shadow: inset 0 0 16px rgba(61, 220, 108, 0.32), inset 0 0 40px rgba(61, 220, 108, 0.16);
      transition: opacity 0.35s ease;
    }
    .np[data-state="watched"] {
      border-color: #3ddc6c;
      box-shadow:
        0 0 16px rgba(61, 220, 108, 0.7),
        0 0 36px rgba(61, 220, 108, 0.42),
        0 22px 60px rgba(0,0,0,0.55);
    }
    .np[data-state="watched"]::after {
      opacity: 1;
      box-sizing: border-box;
      border: 1.5px solid #3ddc6c;
      box-shadow: inset 0 0 16px rgba(61, 220, 108, 0.32), inset 0 0 40px rgba(61, 220, 108, 0.16);
    }
    html.pos-bottom-left .np {
      left: var(--overlay-offset, 24px);
      bottom: calc(var(--overlay-offset, 24px) + var(--osc-clearance, 0px));
      transform: translateY(8px);
    }
    html.pos-bottom-right .np {
      right: var(--overlay-offset, 24px);
      bottom: calc(var(--overlay-offset, 24px) + var(--osc-clearance, 0px));
      transform: translateY(8px);
    }
    html.pos-top-left .np {
      left: var(--overlay-offset, 24px);
      top: var(--overlay-offset, 24px);
      transform: translateY(-8px);
    }
    html.pos-top-right .np {
      right: var(--overlay-offset, 24px);
      top: var(--overlay-offset, 24px);
      transform: translateY(-8px);
    }
    html.pos-top-center .np {
      left: 50%;
      top: var(--overlay-offset, 24px);
      transform: translate(-50%, -8px);
    }
    html.pos-top-full .np,
    html.pos-bottom-full .np {
      left: var(--overlay-offset, 24px);
      right: var(--overlay-offset, 24px);
      min-width: 0;
      max-width: none;
      width: auto;
    }
    html.pos-top-full .np {
      top: var(--overlay-offset, 24px);
      transform: translateY(-8px);
    }
    html.pos-bottom-full .np {
      bottom: calc(var(--overlay-offset, 24px) + var(--osc-clearance, 0px));
      transform: translateY(8px);
    }
    .np.visible {
      opacity: 1;
      pointer-events: auto;
    }
    html.pos-bottom-left .np.visible,
    html.pos-bottom-right .np.visible,
    html.pos-bottom-full .np.visible { transform: translateY(0); }
    html.pos-top-left .np.visible,
    html.pos-top-right .np.visible,
    html.pos-top-full .np.visible { transform: translateY(0); }
    html.pos-top-center .np.visible { transform: translate(-50%, 0); }
    .np.visible.has-link { cursor: pointer; }
    .np.visible.fading {
      opacity: 0;
      pointer-events: auto;
    }
    html.pos-bottom-left .np.visible.fading,
    html.pos-bottom-right .np.visible.fading,
    html.pos-bottom-full .np.visible.fading { transform: translateY(0); }
    html.pos-top-left .np.visible.fading,
    html.pos-top-right .np.visible.fading,
    html.pos-top-full .np.visible.fading { transform: translateY(0); }
    html.pos-top-center .np.visible.fading { transform: translate(-50%, 0); }
    .np.visible.fading.peek { opacity: 1; }
    .np-bg {
      position: absolute;
      inset: -24px -40px -24px 40%;
      background: center / cover no-repeat;
      filter: blur(22px) saturate(160%);
      opacity: 0.38;
      pointer-events: none;
    }
    .np-mosaic-clip {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.28;
      transition: width 0.5s linear;
    }
    .np-mosaic-clip::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(168, 124, 36, 0.42);
      pointer-events: none;
    }
    .np-mosaic {
      position: absolute;
      top: -28%;
      bottom: -28%;
      left: -6%;
      filter: blur(64px) saturate(1.05);
      pointer-events: none;
    }
    .np-mosaic-cell {
      position: absolute;
      width: 30%;
      height: 46%;
      border-radius: 50%;
    }
    .np-wash {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(8,8,12,0.62) 0%, rgba(8,8,12,0.46) 42%, rgba(8,8,12,0.24) 100%);
      pointer-events: none;
    }
    .np-progress-edge {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      margin-left: -1px;
      z-index: 1;
      pointer-events: none;
      background: rgba(168, 120, 255, 0.72);
      box-shadow: 0 0 8px rgba(122, 92, 255, 0.45);
      opacity: 0;
      transition: left 0.5s linear, opacity 0.2s linear;
    }
    .np-poster {
      position: relative;
      z-index: 2;
      width: 86px;
      height: 128px;
      object-fit: cover;
      border-radius: 10px;
      background: #1a2230;
      flex: 0 0 auto;
      display: block;
      box-shadow: 0 10px 24px rgba(0,0,0,0.45);
    }
    .np-copy {
      position: relative;
      z-index: 2;
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 2px 0;
    }
    .np-live-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 28px;
    }
    .np-live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px 4px 8px;
      border: 1.5px solid #3ddc6c;
      border-radius: 8px;
      color: #6ef095;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(6, 18, 10, 0.82);
      box-shadow: 0 0 16px rgba(61, 220, 108, 0.65), inset 0 0 10px rgba(61, 220, 108, 0.22);
      text-shadow: 0 0 8px rgba(110, 240, 149, 0.75);
      flex: 0 0 auto;
    }
    .np-live[hidden] { display: none !important; }
    .np-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3ddc6c;
      box-shadow: 0 0 10px rgba(61, 220, 108, 1);
    }
    .np-live[data-state="waiting"],
    .np-live[data-state="sending"] {
      border-color: #ffc14d;
      color: #ffe3a3;
      background: rgba(28, 18, 4, 0.84);
      box-shadow: 0 0 16px rgba(255, 193, 77, 0.7), inset 0 0 10px rgba(255, 193, 77, 0.22);
      text-shadow: 0 0 8px rgba(255, 210, 122, 0.8);
    }
    .np-live[data-state="waiting"] .np-live-dot,
    .np-live[data-state="sending"] .np-live-dot { background: #ffc14d; box-shadow: 0 0 10px rgba(255, 193, 77, 1); }
    .np-live[data-state="paused"],
    .np-live[data-state="stopped"] {
      border-color: #c5d4e6;
      color: #e7eef6;
      background: rgba(12, 16, 24, 0.84);
      box-shadow: 0 0 16px rgba(180, 198, 220, 0.55), inset 0 0 10px rgba(180, 198, 220, 0.18);
      text-shadow: 0 0 8px rgba(210, 222, 236, 0.7);
    }
    .np-live[data-state="paused"] .np-live-dot,
    .np-live[data-state="stopped"] .np-live-dot { background: #d5e0ec; box-shadow: 0 0 10px rgba(210, 222, 236, 0.95); }
    .np-live[data-state="error"] {
      border-color: #ff8b85;
      color: #ffc2bd;
      background: rgba(28, 8, 8, 0.84);
      box-shadow: 0 0 16px rgba(255, 107, 99, 0.65), inset 0 0 10px rgba(255, 107, 99, 0.2);
      text-shadow: 0 0 8px rgba(255, 140, 132, 0.75);
    }
    .np-live[data-state="error"] .np-live-dot { background: #ff8b85; box-shadow: 0 0 10px rgba(255, 107, 99, 1); }
    .np-live[data-state="off"] {
      border-color: #8b8b8f;
      color: #c8c8cc;
      background: rgba(139, 139, 143, 0.12);
    }
    .np-live[data-state="off"] .np-live-dot { background: #8b8b8f; box-shadow: none; }
    .np-live[data-state="skipped"] {
      border-color: #5ad0ff;
      color: #9ae4ff;
      background: rgba(6, 16, 24, 0.84);
      box-shadow: 0 0 16px rgba(90, 208, 255, 0.65), inset 0 0 10px rgba(90, 208, 255, 0.2);
      text-shadow: 0 0 8px rgba(154, 228, 255, 0.75);
    }
    .np-live[data-state="skipped"] .np-live-dot { background: #5ad0ff; box-shadow: 0 0 8px rgba(90, 208, 255, 0.9); }
    .np-started {
      margin: 0;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .np-title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .np-title {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .np-year {
      margin: 0;
      color: rgba(255,255,255,0.48);
      font-size: 15px;
      font-weight: 600;
      flex: 0 0 auto;
    }
    .np-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .np-meta[hidden] { display: none !important; }
    .np-ep-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(232, 197, 71, 0.85);
      color: #f0d36a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      flex: 0 0 auto;
      background: rgba(22, 16, 4, 0.84);
      box-shadow: 0 0 16px rgba(232, 197, 71, 0.7), inset 0 0 10px rgba(232, 197, 71, 0.22);
      text-shadow: 0 0 8px rgba(240, 211, 106, 0.8);
    }
    .np-ep-pill[hidden] { display: none !important; }
    .np-ep {
      margin: 0;
      color: rgba(255,255,255,0.78);
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .np-stats {
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      padding: 0 4px 0 12px;
      min-width: 132px;
      text-align: right;
    }
    .np-percent {
      font-size: 44px;
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: rgba(255,255,255,0.82);
      font-variant-numeric: tabular-nums;
    }
    .np-percent-label {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.42);
    }
    .np-left {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.72);
    }
    .np-meter-clip {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
      transition: width 0.5s linear;
    }
    .np-meter-top,
    .np-meter-track,
    .np-meter-fill {
      position: absolute;
      left: 0;
      z-index: 3;
      pointer-events: none;
    }
    .np-meter-top {
      top: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #c9a44a 0%, #b8923a 100%);
      box-shadow: 0 0 8px rgba(184, 146, 58, 0.4);
    }
    .np-meter-track {
      right: 0;
      bottom: 0;
      height: 3px;
      background: rgba(255,255,255,0.08);
    }
    .np-meter-fill {
      right: 0;
      bottom: 0;
      height: 3px;
      background: #c26bff;
      box-shadow: 0 0 12px rgba(120, 90, 255, 0.8);
    }
    .np-meter-cap {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 40px;
      z-index: 3;
      pointer-events: none;
      box-sizing: border-box;
      border-radius: 18px 0 0 18px;
      padding: 2px 0 3px 3px;
      background: linear-gradient(180deg, #c9a44a 0%, #b89048 22%, #a07aaa 52%, #6a52c4 78%, #8f5cc4 100%);
      -webkit-mask-image: linear-gradient(#000, #000), linear-gradient(#000, #000);
      -webkit-mask-clip: content-box, border-box;
      -webkit-mask-composite: xor;
      mask-image: linear-gradient(#000, #000), linear-gradient(#000, #000);
      mask-clip: content-box, border-box;
      mask-composite: exclude;
    }
    #skip-wrap {
      position: absolute;
      z-index: 3;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.55s ease, transform 0.55s ease, visibility 0s linear 0.55s, top 0.25s ease, right 0.25s ease, bottom 0.25s ease, left 0.25s ease;
    }
    html.pos-bottom-left #skip-wrap,
    html.pos-top-left #skip-wrap,
    html.pos-top-right #skip-wrap,
    html.pos-top-center #skip-wrap,
    html.pos-top-full #skip-wrap {
      right: var(--overlay-offset, 24px);
      bottom: calc(var(--overlay-offset, 24px) + var(--osc-clearance, 0px));
      transform: translateX(18px);
    }
    html.pos-bottom-right #skip-wrap {
      left: var(--overlay-offset, 24px);
      bottom: calc(var(--overlay-offset, 24px) + var(--osc-clearance, 0px));
      transform: translateX(-18px);
    }
    html.pos-bottom-full #skip-wrap {
      right: var(--overlay-offset, 24px);
      top: var(--overlay-offset, 24px);
      transform: translateX(18px);
    }
    #skip-wrap.visible {
      visibility: visible;
      opacity: 1;
      transition-delay: 0s;
    }
    html.pos-bottom-left #skip-wrap.visible,
    html.pos-bottom-right #skip-wrap.visible,
    html.pos-top-left #skip-wrap.visible,
    html.pos-top-right #skip-wrap.visible,
    html.pos-top-center #skip-wrap.visible,
    html.pos-top-full #skip-wrap.visible,
    html.pos-bottom-full #skip-wrap.visible {
      transform: translateX(0);
    }
    #skip-wrap.visible.fading {
      visibility: visible;
      opacity: 0.16;
    }
    #skip-wrap.visible:hover,
    #skip-wrap.visible.fading:hover { opacity: 1; }
    #skip {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px 8px 12px;
      border: 1.5px solid #e8c547;
      border-radius: 8px;
      color: #f0d36a;
      background: rgba(18, 14, 6, 0.82);
      box-shadow: 0 0 18px rgba(232, 197, 71, 0.42);
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }
    #skip:hover {
      background: rgba(36, 28, 10, 0.9);
      box-shadow: 0 0 22px rgba(232, 197, 71, 0.55);
    }
    .skip-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e8c547;
      box-shadow: 0 0 8px rgba(232, 197, 71, 0.9);
      flex: 0 0 auto;
    }
  </style>
</head>
<body>
  <div id="hover-pad" data-clickable></div>
  <div id="np" class="np" data-clickable>
    <div id="np-bg" class="np-bg"></div>
    <div class="np-wash"></div>
    <div id="np-mosaic-clip" class="np-mosaic-clip"><div id="np-mosaic" class="np-mosaic"></div></div>
    <img id="np-poster" class="np-poster" alt="">
    <div class="np-copy">
      <div class="np-live-row">
        <span id="np-live" class="np-live" hidden>
          <span class="np-live-dot"></span>
          <span id="np-live-label">Now Watching</span>
        </span>
        <p id="np-started" class="np-started"></p>
      </div>
      <div class="np-title-row">
        <p id="np-title" class="np-title"></p>
        <p id="np-year" class="np-year" hidden></p>
      </div>
      <div id="np-meta" class="np-meta" hidden>
        <span id="np-ep-pill" class="np-ep-pill" hidden></span>
        <p id="np-ep" class="np-ep"></p>
      </div>
    </div>
    <div class="np-stats">
      <div id="np-percent" class="np-percent">0%</div>
      <div class="np-percent-label">WATCHED</div>
      <div id="np-left" class="np-left"></div>
    </div>
    <div id="np-progress-edge" class="np-progress-edge"></div>
    <div class="np-meter-track"></div>
    <div id="np-meter-clip" class="np-meter-clip">
      <div id="np-meter-cap" class="np-meter-cap"></div>
      <div id="np-meter-top" class="np-meter-top"></div>
      <div id="np-meter-fill" class="np-meter-fill"></div>
    </div>
  </div>
  <div id="skip-wrap" data-clickable>
    <button id="skip" type="button" data-clickable>
      <span class="skip-dot"></span>
      <span id="skip-label">Skip Intro</span>
    </button>
  </div>
  <script>
    (function () {
      var np = document.getElementById("np");
      var npBg = document.getElementById("np-bg");
      var poster = document.getElementById("np-poster");
      var live = document.getElementById("np-live");
      var liveLabel = document.getElementById("np-live-label");
      var started = document.getElementById("np-started");
      var title = document.getElementById("np-title");
      var year = document.getElementById("np-year");
      var meta = document.getElementById("np-meta");
      var epPill = document.getElementById("np-ep-pill");
      var episode = document.getElementById("np-ep");
      var percent = document.getElementById("np-percent");
      var left = document.getElementById("np-left");
      var mosaicClip = document.getElementById("np-mosaic-clip");
      var mosaic = document.getElementById("np-mosaic");
      var progressEdge = document.getElementById("np-progress-edge");
      var meterClip = document.getElementById("np-meter-clip");
      var mosaicUrl = "";
      var skipWrap = document.getElementById("skip-wrap");
      var skip = document.getElementById("skip");
      var skipLabel = document.getElementById("skip-label");
      var hoverPad = document.getElementById("hover-pad");
      var peekTimer = null;
      var peekHoldMs = 2500;
      var mediaUrl = "";
      var windowHovered = false;
      var trackWindowHover = false;

      function post(name, data) {
        try {
          if (typeof iina !== "undefined" && typeof iina.postMessage === "function") {
            iina.postMessage(name, data);
          }
        } catch (_error) {}
      }

      function pad2(value) {
        var n = Math.max(0, Math.floor(Number(value) || 0));
        return n < 10 ? "0" + n : String(n);
      }

      function episodePill(payload) {
        if (!payload || payload.kind === "movie") return "";
        if (payload.episodePill) return String(payload.episodePill);
        var ep = payload.number != null ? Number(payload.number) : 0;
        if ((!ep || !isFinite(ep)) && payload.episodeChip) ep = Number(payload.episodeChip);
        if (!isFinite(ep) || ep <= 0) return "";
        ep = Math.floor(ep);
        if (payload.kind === "anime") return "Ep. " + ep;
        var season = Number(payload.season != null ? payload.season : payload.seasonChip);
        if (isFinite(season) && season > 0) return "S" + pad2(season) + "E" + pad2(ep);
        var code = String(payload.episodeCode || "").trim();
        return code || "Ep. " + ep;
      }

      function mosaicColor(r, g, b) {
        var avg = (r + g + b) / 3;
        var sat = 1.12;
        var next = [r, g, b].map(function (channel) {
          var value = avg + (channel - avg) * sat;
          if (avg < 64) value += 26;
          return Math.max(0, Math.min(255, Math.round(value)));
        });
        return "rgb(" + next[0] + "," + next[1] + "," + next[2] + ")";
      }

      function paintMosaic(url) {
        if (!mosaic) return;
        if (!url) {
          mosaicUrl = "";
          mosaic.textContent = "";
          return;
        }
        if (url === mosaicUrl) return;
        mosaicUrl = url;
        var img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = function () {
          if (url !== mosaicUrl) return;
          var cols = 8;
          var rows = 5;
          var canvas = document.createElement("canvas");
          canvas.width = cols;
          canvas.height = rows;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, cols, rows);
          var pixels;
          try {
            pixels = ctx.getImageData(0, 0, cols, rows).data;
          } catch (_error) {
            return;
          }
          mosaic.textContent = "";
          var y;
          var x;
          for (y = 0; y < rows; y += 1) {
            for (x = 0; x < cols; x += 1) {
              var offset = (y * cols + x) * 4;
              var cell = document.createElement("div");
              cell.className = "np-mosaic-cell";
              cell.style.backgroundColor = mosaicColor(pixels[offset], pixels[offset + 1], pixels[offset + 2]);
              cell.style.left = ((x + 0.15) / cols * 100 - 8) + "%";
              cell.style.top = ((y + 0.15) / rows * 100 - 12) + "%";
              mosaic.appendChild(cell);
            }
          }
          if (np) mosaic.style.width = Math.max(np.clientWidth, 1) + "px";
        };
        img.src = url;
      }

      function setProgressMeter(progress) {
        var value = Number(progress);
        if (!isFinite(value) || value < 0) value = 0;
        if (value > 100) value = 100;
        var width = value.toFixed(2) + "%";
        if (mosaic && np) mosaic.style.width = Math.max(np.clientWidth, 1) + "px";
        if (mosaicClip) mosaicClip.style.width = width;
        if (meterClip) meterClip.style.width = width;
        if (!progressEdge) return;
        progressEdge.style.left = width;
        progressEdge.style.opacity = value > 0 ? "0.8" : "0";
      }

      function clearPeekTimer() {
        if (peekTimer) {
          clearTimeout(peekTimer);
          peekTimer = null;
        }
      }

      function hidePeek() {
        clearPeekTimer();
        np.classList.remove("peek");
      }

      function showPeek() {
        if (!np.classList.contains("visible") || !np.classList.contains("fading")) return;
        np.classList.add("peek");
        setHoverPad(true);
        clearPeekTimer();
        peekTimer = setTimeout(hidePeek, peekHoldMs);
      }

      function setHoverPad(on) {
        hoverPad.classList.toggle("active", !!on);
      }

      function setWindowHovered(on) {
        on = !!on;
        if (windowHovered === on) return;
        windowHovered = on;
        post(on ? "overlay-hover" : "overlay-leave");
      }

      function eventStaysInside(event) {
        var to = event && event.relatedTarget;
        if (!to) return false;
        return !!(
          (np.contains && np.contains(to)) ||
          (hoverPad.contains && hoverPad.contains(to)) ||
          to === np ||
          to === hoverPad
        );
      }

      function syncWindowHover() {
        if (!trackWindowHover) return;
        var hovered = false;
        try {
          hovered = !!(
            (hoverPad.matches && hoverPad.matches(":hover")) ||
            (np.matches && np.matches(":hover"))
          );
        } catch (_error) {}
        setWindowHovered(hovered);
      }

      function installHitTest() {
        if (!window.iina) return;
        window.iina._hitTest = function (x, y) {
          var el = document.elementFromPoint(x, y);
          if (!el) return false;
          if (el.closest && el.closest("#skip-wrap.visible")) return true;
          if (hoverPad.classList.contains("active")) return true;
          if (el.dataset && Object.prototype.hasOwnProperty.call(el.dataset, "clickable")) return true;
          return false;
        };
      }

      function applyNowPlaying(payload, fading, scrobble, trackHover) {
        if (!payload) {
          hidePeek();
          mediaUrl = "";
          np.classList.remove("visible");
          np.classList.remove("fading");
          np.classList.remove("has-link");
          delete np.dataset.state;
          np.removeAttribute("title");
          trackWindowHover = false;
          setHoverPad(false);
          setWindowHovered(false);
          setProgressMeter(0);
          paintMosaic("");
          return;
        }
        var posterUrl = payload.posterUrl || "https://wsrv.nl/?url=https://simkl.in/poster_no_pic_c.png";
        var safePoster = /^https:\/\/wsrv\.nl\//.test(posterUrl) && !/["')\\\s]/.test(posterUrl) ? posterUrl : "";
        poster.src = safePoster || "https://wsrv.nl/?url=https://simkl.in/poster_no_pic_c.png";
        npBg.style.backgroundImage = safePoster ? 'url("' + safePoster + '")' : "";
        paintMosaic(safePoster);
        title.textContent = payload.title || "Unknown title";
        if (payload.year) {
          year.hidden = false;
          year.textContent = "(" + payload.year + ")";
        } else {
          year.hidden = true;
          year.textContent = "";
        }
        var ep = episodePill(payload);
        if (ep) {
          meta.hidden = false;
          epPill.hidden = false;
          epPill.textContent = ep;
          episode.textContent = payload.episodeTitle || "";
          episode.style.display = payload.episodeTitle ? "block" : "none";
        } else {
          epPill.hidden = true;
          epPill.textContent = "";
          episode.textContent = "";
          meta.hidden = true;
        }
        var rawProgress = Number(payload.progress || 0);
        if (!isFinite(rawProgress) || rawProgress < 0) rawProgress = 0;
        if (rawProgress > 100) rawProgress = 100;
        var progress = Math.round(rawProgress);
        percent.textContent = progress + "%";
        left.textContent = payload.remainingLabel || "";
        setProgressMeter(rawProgress);
        var chip = scrobble || payload.status || null;
        if (!chip || !chip.label) {
          live.hidden = true;
          live.dataset.state = "";
          liveLabel.textContent = "";
        } else {
          live.hidden = false;
          live.dataset.state = chip.state || "watching";
          liveLabel.textContent = chip.label;
        }
        if (payload.watched || (chip && chip.state === "watched")) np.dataset.state = "watched";
        else delete np.dataset.state;
        started.textContent = payload.startedLabel || "";
        mediaUrl = payload.url ? String(payload.url) : "";
        np.classList.toggle("has-link", !!mediaUrl);
        if (mediaUrl) np.setAttribute("title", "Open on Simkl");
        else np.removeAttribute("title");
        np.classList.toggle("fading", !!fading);
        np.classList.add("visible");
        trackWindowHover = !!trackHover && !fading;
        setHoverPad(!!fading || trackWindowHover);
        if (!fading) hidePeek();
        if (trackWindowHover) setTimeout(syncWindowHover, 0);
        else if (!fading) setWindowHovered(false);
      }

      function applyLayout(state) {
        var pos = String((state && state.position) || "bottom-left");
        if (!/^(top-left|bottom-left|top-right|bottom-right|top-center|top-full|bottom-full)$/.test(pos)) pos = "bottom-left";
        var offset = Number(state && state.offsetPx);
        if (!isFinite(offset)) offset = 24;
        if (offset < 0) offset = 0;
        if (offset > 240) offset = 240;
        var clearance = Math.max(0, Number(state && state.oscClearance || 0));
        document.documentElement.style.setProperty("--overlay-offset", offset + "px");
        document.documentElement.style.setProperty("--osc-clearance", clearance + "px");
        document.documentElement.classList.remove(
          "pos-top-left",
          "pos-bottom-left",
          "pos-top-right",
          "pos-bottom-right",
          "pos-top-center",
          "pos-top-full",
          "pos-bottom-full"
        );
        document.documentElement.classList.add("pos-" + pos);
      }

      function applySkip(visible, fading, label) {
        if (skipLabel) skipLabel.textContent = label || "Skip Intro";
        else skip.textContent = label || "Skip Intro";
        skipWrap.classList.toggle("visible", !!visible);
        skipWrap.classList.toggle("fading", !!visible && !!fading);
      }

      function requestSkip(event) {
        if (event) event.stopPropagation();
        post("skip-intro");
      }

      skip.addEventListener("click", requestSkip);
      np.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        if (mediaUrl) post("overlay-open", { url: mediaUrl });
      });
      np.addEventListener("mouseenter", function () {
        if (trackWindowHover) setWindowHovered(true);
        showPeek();
      });
      np.addEventListener("mousemove", function () {
        if (trackWindowHover) setWindowHovered(true);
        showPeek();
      });
      np.addEventListener("mouseleave", function (event) {
        if (trackWindowHover && !eventStaysInside(event)) setWindowHovered(false);
      });
      hoverPad.addEventListener("mouseenter", function () {
        if (trackWindowHover) setWindowHovered(true);
        showPeek();
      });
      hoverPad.addEventListener("mousemove", function () {
        if (trackWindowHover) setWindowHovered(true);
        showPeek();
      });
      hoverPad.addEventListener("mouseleave", function (event) {
        if (trackWindowHover && !eventStaysInside(event)) setWindowHovered(false);
      });
      hoverPad.addEventListener("dblclick", function (event) {
        event.preventDefault();
        post("overlay-dblclick");
      });
      hoverPad.addEventListener("contextmenu", function (event) {
        event.preventDefault();
        post("overlay-pause");
      });

      if (typeof iina !== "undefined") {
        installHitTest();
        setTimeout(installHitTest, 0);
        iina.onMessage("peek", function () {
          showPeek();
        });
        iina.onMessage("overlay-state", function (state) {
          state = state || {};
          applyLayout(state);
          applyNowPlaying(
            state.nowPlaying || null,
            !!state.nowPlayingFading,
            state.scrobble,
            !!state.trackHover
          );
          applySkip(!!state.skip, !!state.skipFading, state.skipLabel);
        });
        post("overlay-ready");
      }
    })();
  </script>
</body>
</html>
